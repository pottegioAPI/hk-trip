<title>ทริปฮ่องกง 14–17 พ.ย.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: phone app shell — sticky top bar, one scrolling view, fixed bottom tab bar + floating "add expense" button */
:root{
  --bg:#FFF5F9; --surface:#FFFFFF; --surface2:#FFE8F1; --ink:#2A1931; --muted:#7D6684; --line:#F2D6E3;
  --pink:#FF4F8B; --pink-ink:#FFFFFF; --pink-soft:#FFD6E5;
  --sun:#FFC23D; --sun-soft:#FFF0C7; --sky:#3FB2E6; --sky-soft:#D8F1FC; --mint:#22C08B; --mint-soft:#D3F6E8;
  --grape:#9B7BFF; --grape-soft:#ECE5FF; --danger:#E5484D;
  --shadow:0 6px 18px rgba(255,79,139,.13);
  --display:'Mitr','Noto Sans Thai','Thonburi',system-ui,sans-serif;
  --body:'Anuphan','Noto Sans Thai','Thonburi',system-ui,sans-serif;
  /* MTR line colours */
  --twl:#E2231A; --ktl:#00AB4E; --isl:#007DC5; --tcl:#F7943E; --drl:#F173AC; --tml:#923011; --eal:#5EB6E4; --tkl:#7D499D; --sil:#9AA51B;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1220; --surface:#271A2D; --surface2:#34223B; --ink:#FBEEF4; --muted:#BDA6C4; --line:#43304B;
  --pink:#FF6A9C; --pink-ink:#1B1220; --pink-soft:#4A2337;
  --sun:#FFCB57; --sun-soft:#43361A; --sky:#5CC2EE; --sky-soft:#173847; --mint:#3DD39F; --mint-soft:#14392D;
  --grape:#B29BFF; --grape-soft:#2F2750; --danger:#FF6B6F; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1220; --surface:#271A2D; --surface2:#34223B; --ink:#FBEEF4; --muted:#BDA6C4; --line:#43304B;
  --pink:#FF6A9C; --pink-ink:#1B1220; --pink-soft:#4A2337;
  --sun:#FFCB57; --sun-soft:#43361A; --sky:#5CC2EE; --sky-soft:#173847; --mint:#3DD39F; --mint-soft:#14392D;
  --grape:#B29BFF; --grape-soft:#2F2750; --danger:#FF6B6F; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
header.top .wrap{padding-block:12px 10px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;flex:none;border-radius:14px;background:var(--pink);display:grid;place-items:center;color:var(--pink-ink);transform:rotate(-6deg);box-shadow:var(--shadow)}
.logo svg{width:24px;height:24px}
.ttl{min-width:0;flex:1}
.ttl h1{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{flex:none;font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--mint)}
.live{margin-top:6px}.lvl{list-style:none;margin:0 0 6px;padding:8px 10px;background:var(--mint-soft);border-radius:12px;display:flex;flex-direction:column;gap:3px;font-size:13px}.lvl li{display:flex;gap:8px;align-items:baseline}.lvl b{min-width:62px;color:var(--ink)}
.sync.wait i{background:var(--sun)}

main .wrap{padding-block:4px calc(130px + env(safe-area-inset-bottom,0px))}
section.view[hidden]{display:none}

/* day chips */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.day{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:8px 4px 7px;text-align:center;line-height:1.15}
.day b{display:block;font-family:var(--display);font-weight:500;font-size:19px}
.day small{font-size:11.5px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:var(--pink-ink);box-shadow:var(--shadow)}
.day[aria-pressed="true"] small{color:inherit;opacity:.85}

.dayhead{background:var(--surface);border-radius:22px;padding:16px;border:1px solid var(--line);margin-bottom:16px;position:relative;overflow:hidden}
.dayhead .eyebrow{font-size:12px;letter-spacing:.06em;color:var(--pink);font-weight:600}
.dayhead h2{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.3;margin:2px 0 10px;text-wrap:balance;padding-right:40px}
.dayhead .blob{position:absolute;right:-18px;top:-18px;width:78px;height:78px;border-radius:50%;background:var(--sun-soft)}
.dayhead .blob::after{content:"";position:absolute;left:18px;top:30px;width:26px;height:26px;border-radius:50%;background:var(--sun)}
.pillrow{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--surface2);display:inline-flex;align-items:center;gap:5px}
.pill.sky{background:var(--sky-soft)} .pill.mint{background:var(--mint-soft)} .pill.sun{background:var(--sun-soft)}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:21px;top:8px;bottom:8px;width:3px;border-radius:3px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px)}
.it{display:grid;grid-template-columns:44px 1fr;gap:10px;margin-bottom:12px;position:relative}
.tick{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;z-index:1;color:transparent}
.tick svg{width:20px;height:20px}
.it.done .tick{background:var(--mint);border-color:var(--mint);color:#fff}
.it.now .tick{border-color:var(--pink);box-shadow:0 0 0 5px var(--pink-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:11px 13px;min-width:0}
.it.now .card{border-color:var(--pink);box-shadow:var(--shadow)}
.it.done .card{opacity:.62}
.time{font-family:var(--display);font-size:13.5px;color:var(--pink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nowtag{font-family:var(--body);font-size:11px;font-weight:600;background:var(--pink);color:var(--pink-ink);padding:1px 8px;border-radius:99px}
.card h3{font-family:var(--display);font-weight:500;font-size:16.5px;line-height:1.35;margin:1px 0 3px}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card p b{color:var(--ink);font-weight:600}
.tip{margin-top:8px;font-size:13px;background:var(--sun-soft);border-radius:12px;padding:7px 10px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.btn-s{border:none;background:var(--surface2);border-radius:99px;padding:5px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink)}
.btn-s svg{width:14px;height:14px}
.btn-s.pay{background:var(--pink-soft)}
.btn-s.paid{background:var(--mint-soft)}

/* route */
.route{margin-top:9px;background:var(--bg);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.leg{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13.5px}
.ln{font-size:11.5px;font-weight:600;color:#fff;padding:2px 9px;border-radius:99px;white-space:nowrap}
.ln.bus{background:var(--ink);color:var(--bg)}
.arrow{color:var(--muted)}
.exit{font-size:12px;font-weight:600;border:1.5px solid var(--ink);border-radius:6px;padding:0 6px}
.fare{margin-left:auto;font-size:12.5px;color:var(--muted)}

/* money */
.hero{background:var(--pink);color:var(--pink-ink);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.hero .lab{font-size:13px;opacity:.9}
.hero .big{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1}
.hero .big small{font-size:15px;font-weight:400}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.person{background:rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;min-width:0}
.person .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .v{font-family:var(--display);font-size:18px}
.bar{height:9px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden;margin:5px 0 4px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--sun)}
.bar.over i{background:#fff}
.person small{font-size:11.5px;opacity:.92;display:block}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px}
.panel h3{font-family:var(--display);font-weight:500;font-size:16.5px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h3 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400}
.stack{display:flex;height:14px;border-radius:14px;overflow:hidden;background:var(--surface2);margin-bottom:10px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px;min-width:0}
.legend span.n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:4px;flex:none}
.daybars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:120px}
.db{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11.5px;min-width:0}
.db .trk{flex:1;width:100%;max-width:50px;position:relative;display:flex;align-items:flex-end}
.db .col{width:100%;border-radius:10px 10px 4px 4px;background:var(--sky);min-height:3px}
.db .plan{position:absolute;left:-3px;right:-3px;border-top:2px dashed var(--pink)}
.db .amt{font-variant-numeric:tabular-nums;color:var(--muted)}
.db b{font-weight:600}
.note{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
.settle{display:flex;align-items:center;gap:12px;font-size:15px}
.settle .ic{width:42px;height:42px;border-radius:14px;background:var(--mint-soft);display:grid;place-items:center;flex:none;color:var(--mint)}
.settle .ic svg{width:22px;height:22px}
.settle b{font-family:var(--display);font-weight:500}

.list{list-style:none;margin:0;padding:0}
.grp{font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 4px;display:flex;justify-content:space-between}
.ex{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:none}
.ex .ci{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.ex .ci svg{width:19px;height:19px}
.ex .t{min-width:0}
.ex .t div{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex .t small{color:var(--muted);font-size:12px}
.ex .a{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.25}
.ex .a small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.exbtn{all:unset;display:contents;cursor:pointer}
.confirm{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.confirm button{border:none;border-radius:99px;padding:6px 14px;font-size:13px;background:var(--surface2)}
.confirm .del{background:var(--danger);color:#fff}
.empty{text-align:center;padding:18px 8px 8px;color:var(--muted);font-size:14px}
.empty svg{width:54px;height:54px;color:var(--pink);margin-bottom:6px}

/* travel */
.lines{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.show{background:var(--surface2);border-radius:16px;padding:14px;font-size:22px;line-height:1.45;font-family:'Noto Sans TC','PingFang TC',sans-serif;text-align:center}
.show small{display:block;font-size:12.5px;font-family:var(--body);color:var(--muted)}
.links{display:grid;gap:8px}
.lk{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--surface2);text-decoration:none;color:var(--ink);font-weight:500}
.lk svg{width:18px;height:18px;flex:none;color:var(--pink)}
.lk span{flex:1;min-width:0}
.lk small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.journeys{display:flex;flex-direction:column;gap:8px}
.jr{background:var(--bg);border-radius:14px;padding:9px 10px}
.jr .h{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
/* go-anywhere planner */
.planner{background:var(--surface);border:2px solid var(--pink-soft);border-radius:22px;padding:14px;margin-bottom:14px}
.planner h3{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 2px}
.planner > p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.odp{display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:center}
.odp .sel{display:flex;flex-direction:column;gap:6px;min-width:0}
.odp label{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.odp label i{width:10px;height:10px;border-radius:50%;border:3px solid var(--pink)}
.odp label i.to{background:var(--pink)}
.odp select{width:100%;min-width:0;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 10px;font-size:16px}
.swap{grid-row:1/3;grid-column:2;width:40px;height:40px;border-radius:50%;border:none;background:var(--surface2);display:grid;place-items:center}
.swap svg{width:18px;height:18px;transform:rotate(90deg)}
.places{display:flex;gap:7px;overflow-x:auto;margin:12px -14px 0;padding:0 14px 4px;scrollbar-width:none}
.places::-webkit-scrollbar{display:none}
.places .chip{white-space:nowrap;flex:none;font-size:13px;padding:5px 11px}
.res{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--bg);border-radius:14px;padding:8px 10px;min-width:0}
.sum small{display:block;font-size:11.5px;color:var(--muted)}
.sum b{font-family:var(--display);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.legs{list-style:none;margin:0;padding:0;position:relative}
.lg{display:grid;grid-template-columns:18px 1fr;gap:10px;position:relative;padding-bottom:12px}
.lg::before{content:"";position:absolute;left:6px;top:14px;bottom:-2px;width:6px;border-radius:6px;background:var(--c)}
.lg.walk::before{background:repeating-linear-gradient(var(--muted) 0 4px,transparent 4px 8px);width:3px;left:7.5px}
.lg .nd{width:18px;height:18px;border-radius:50%;border:4px solid var(--c);background:var(--surface);z-index:1;margin-top:2px}
.lg .stn{font-weight:600;line-height:1.3}
.lg .stn small{font-weight:400;color:var(--muted);margin-left:4px}
.lg .how{font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lg.end{padding-bottom:0}
.lg.end::before{display:none}
.xnote{margin-top:10px;font-size:13px;background:var(--sky-soft);border-radius:12px;padding:8px 10px}
.src{font-size:11.5px;color:var(--muted);margin-top:10px}
ul.tips{margin:0;padding-left:20px;font-size:14px}
ul.tips li{margin-bottom:4px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding-block:6px}
.tab.dzt-tab{position:relative;padding-top:0}
.hhero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;margin-bottom:12px;color:#fff;background:linear-gradient(140deg,var(--pink),var(--grape) 60%,var(--sky));box-shadow:var(--shadow)}
.hhero .plane{position:absolute;right:-6px;top:6px;width:150px;opacity:.95}
.hi{font-size:14px;font-weight:600;opacity:.95}
.hbig{font-family:var(--display);font-weight:600;font-size:44px;line-height:1.05;margin:4px 0 2px}
.hsub{font-size:15px;font-weight:500;max-width:78%}
.hdate{margin-top:10px;font-size:12.5px;opacity:.9}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.hstats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:9px 10px;min-width:0}
.hstats small{display:block;font-size:11.5px;color:var(--muted)}
.hstats b{display:block;font-family:var(--display);font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstats span{font-size:11px;color:var(--muted)}
.tmap{width:100%;height:auto;display:block}
.mspot{cursor:pointer}.mspot:active{opacity:.6}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--sun)}}.it.flash .card{animation:flash 1.8s ease-out}
.tmwrap{border-radius:18px;overflow:hidden}.tmwrap.big{overflow:auto;max-height:340px;-webkit-overflow-scrolling:touch}.tmwrap.big .tmap{width:240%;max-width:none}
.hleg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.hlchip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.hlchip i{width:10px;height:10px;border-radius:50%;background:var(--dc)}
.hlchip[aria-pressed="true"]{border-color:var(--dc);background:var(--dc);color:#fff}
.hlchip[aria-pressed="true"] i{background:#fff}
.hleg .mini{display:flex;align-items:center;gap:4px}
.hh{width:10px;height:10px;background:var(--sun);display:inline-block;clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}
.hdays{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.hday{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--dc);border-radius:18px;padding:10px 12px}
.hdn{text-align:center;line-height:1.1}
.hdn b{display:block;font-family:var(--display);font-size:24px;color:var(--dc)}
.hdn small{font-size:12px;color:var(--muted)}
.hdt{min-width:0}
.hdt b{display:block;font-family:var(--display);font-weight:500;font-size:15px;line-height:1.3}
.hdt small{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar{display:block;height:6px;border-radius:6px;background:var(--surface2);margin-top:6px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--dc)}
.dzbtn{width:54px;height:54px;margin-top:-26px;border-radius:50%;background:var(--pink);color:var(--pink-ink);display:grid;place-items:center;box-shadow:0 6px 16px rgba(255,79,139,.4);border:4px solid var(--surface)}
.dzbtn svg{width:28px;height:28px}
.tab.dzt-tab[aria-selected="true"]{background:none}
.tab.dzt-tab[aria-selected="true"] .dzbtn{background:var(--sun);color:var(--ink)}
.dzhero{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}
.dzhero .castle{width:72px;height:72px}
.dzhero h2{font-family:var(--display);font-weight:500;font-size:21px;margin:2px 0 8px}
.dzplan{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.dzb{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.dzb.now{border-color:var(--pink);box-shadow:var(--shadow)}

/* ---------- live arrivals (MTR Next Train, KMB/LWB and Citybus ETA — Hong Kong government open data) ---------- */
const mtrCode = i => MTR.st[i][0];
// is this train going our way? compare where it ends with where we are going, along the line's station order
function mtrSameWay(line, from, to, dest){
  const ids=MTR.ids, f=ids[from], t=ids[to], dI=NET.byCode[dest]; if(dI==null) return null; const d=ids[dI];
  for(const q of MTR.lines[line]||[]){ const pf=q.indexOf(f), pt=q.indexOf(t); if(pf<0||pt<0) continue;
    let pd=q.indexOf(d);
    if(pd<0) for(const q2 of MTR.lines[line]){ const a=q2.indexOf(f), b=q2.indexOf(d); if(a>=0&&b>=0){ pd=pf+(b-a); break } }
    if(pd<0) return null;
    return Math.sign(pd-pf)===Math.sign(pt-pf) && pd!==pf; }
  return null;
}
async function liveJSON(url){ const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json() }

async function liveMTR(line, from, to){
  const j=await liveJSON(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${mtrCode(from)}`);
  if(j.status===0 || !j.data) return {msg: j.message ? 'MTR แจ้ง: '+j.message : 'ตอนนี้ไม่มีข้อมูลขบวนรถ', url:j.url};
  const st=j.data[`${line}-${mtrCode(from)}`]||{}, trains=[...(st.UP||[]),...(st.DOWN||[])].filter(x=>x.valid!=='N' && mtrSameWay(line,from,to,x.dest));
  if(!trains.length) return {msg: j.isdelay==='Y' ? 'MTR แจ้งว่ารถล่าช้า' : 'ตอนนี้ไม่มีขบวนไปทางนี้ (อาจหมดรอบแล้ว)'};
  trains.sort((a,b)=>a.time<b.time?-1:1);
  return {rows: trains.slice(0,3).map(x=>({m:minsTo(x.time), txt:`ไป ${stName(NET.byCode[x.dest])} · ชานชาลา ${x.plat}`})), delay:j.isdelay==='Y'};

/* ---------- money ---------- */
function share(e,p){ // how much of e is p's own spending
  if(e.kind==='settle') return 0;
  if(e.type==='split') return e.amt/2;
  if(e.type==='adv') return e.payer===p ? 0 : e.amt;
  return e.payer===p ? e.amt : 0;
}
function balance(){ // > 0: person 1 owes person 0
  let b=0;
  for(const e of S.expenses){
    const s = e.payer===0 ? 1 : -1;
    if(e.kind==='settle') b -= s*e.amt;            // payer gives money back
    else if(e.type==='split') b += s*e.amt/2;
    else if(e.type==='adv') b += s*e.amt;
  }
  return Math.round(b*100)/100;
}

// balance = last "set to actual" + top-ups − fares this person paid with the card since then
function octoState(){
  const me=S.me??0;
  const pays=allExp().filter(e=>e.oct && e.payer===me && e.kind!=='settle').map(e=>({k:'pay', amt:e.amt, at:e.at||0, note:e.note||'ค่าเดินทาง', auto:e.auto, key:'e:'+e.id}));
  const ev=[...S.octo.map(o=>({...o, key:'c:'+o.at})), ...pays].sort((a,b)=>a.at-b.at);
  let bal=null;
  for(const x of ev){ if(x.k==='set') bal=x.amt; else if(x.k==='top') bal=(bal||0)+x.amt; else if(bal!=null) bal=Math.round((bal-x.amt)*10)/10; x.after=bal }
  const spent=pays.reduce((s,p)=>s+p.amt,0), tops=S.octo.filter(o=>o.k==='top').reduce((s,o)=>s+o.amt,0);
  return {bal, ev:ev.reverse(), spent, tops};
}

function tripMapSVG(){
  const land = HK_LAND;
  const lines = NET && BUS ? Object.entries(MTR.lines).map(([ln,seqs])=>seqs.map(q=>{
      const pts=q.map(id=>stLL(MTR.st[NET.byId[id]][0])).filter(Boolean).map(px);
      return `<polyline points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${LINES[ln].c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".3"/>` }).join('')).join('') : '';
  const sel=S.homeDay, hotel=px(HOTEL_LL), spots=new Map();
  const routes = DAYS.map((d,di)=>{
    const items=dayItems(d.n), pts=items.map(locOf).filter(Boolean).map(px);
    if(!pts.length) return '';
    const on = sel==null || sel===d.n;
    items.forEach(it=>{ const ll=locOf(it); if(!ll) return; const sp=MAP_SPOT[it.id];
      if(!sp && metres(ll,HOTEL_LL)<500) return; // breakfasts and dinners around the guesthouse
      const at=px(sp&&sp[2]||ll), nd=sp&&sp[3]||[0,0], p=[at[0]+nd[0],at[1]+nd[1]], key=sp?sp[0]+sp[1]:Math.round(p[0]/8)+','+Math.round(p[1]/8);
      const s=spots.get(key)||{p, at, ic:sp?sp[0]:'pin', name:sp?sp[1]:it.h, days:new Set(), go:[], on:false};
      s.days.add(di); s.go.push([d.n,it.id]); s.on = s.on||on; spots.set(key,s) });
    return `<polyline points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${DAY_C[di]}" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round" opacity="${on?.9:.12}"/>`;
  }).join('');
  const icons=[...spots.values()].sort((a,b)=>a.p[1]-b.p[1]).map(s=>{ const ds=[...s.days], c=DAY_C[ds[0]];
    const lead = Math.hypot(s.p[0]-s.at[0],s.p[1]-s.at[1])>3 ? `<g opacity="${s.on?1:.25}"><path d="M${s.at[0].toFixed(1)} ${s.at[1].toFixed(1)}L${s.p[0].toFixed(1)} ${(s.p[1]+6).toFixed(1)}" stroke="${c}" stroke-width="1.2" stroke-dasharray="2 2"/><circle cx="${s.at[0].toFixed(1)}" cy="${s.at[1].toFixed(1)}" r="2.4" fill="${c}" stroke="#fff" stroke-width="1"/></g>` : '';
    const go = (sel!=null && s.go.find(g=>g[0]===sel)) || s.go[0];
    return lead+`<g class="mspot" data-mapgo="${go[0]}:${go[1]}" role="button" tabindex="0" aria-label="ดูแผน ${esc(s.name)}" transform="translate(${s.p[0].toFixed(1)},${s.p[1].toFixed(1)})" opacity="${s.on?1:.25}">
      <circle r="17" cy="3" fill="transparent"/><ellipse cy="13" rx="9" ry="2.6" fill="#000" opacity=".1"/>${MAP_ICON[s.ic]}
      <text y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="var(--ink)" stroke="var(--surface)" stroke-width="2.6" paint-order="stroke">${esc(s.name.length>16?s.name.slice(0,15)+'…':s.name)}</text>
      ${ds.map((di,i)=>`<g transform="translate(${10+i*9},-11)"><circle r="5" fill="${DAY_C[di]}" stroke="#fff" stroke-width="1.4"/><text y="2.6" text-anchor="middle" font-size="7" font-weight="800" fill="#fff">${di+1}</text></g>`).join('')}</g>` }).join('');
  const label=(ll,t)=>{ const p=px(ll); return `<text x="${p[0].toFixed(0)}" y="${p[1].toFixed(0)}" text-anchor="middle" font-size="9" fill="#6b9c58" font-weight="700" letter-spacing=".5" opacity=".85">${t}</text>` };
  const wave=(la,lo)=>{ const p=px([la,lo]); return `<path d="M${(p[0]-12).toFixed(0)} ${p[1].toFixed(0)} q6 -5 12 0 t12 0" fill="none" stroke="#fff" stroke-width="1.6" opacity=".8" stroke-linecap="round"/>` };
  const tree=(la,lo)=>{ const p=px([la,lo]); return `<g transform="translate(${p[0].toFixed(0)},${p[1].toFixed(0)})" opacity=".75"><rect x="-.8" y="1" width="1.6" height="3" fill="#a07850"/><circle r="3.6" fill="#8fcf7a"/></g>` };
  return `<svg viewBox="0 0 ${MAP.w} ${MAP.h}" class="tmap" role="img" aria-label="แผนที่จุดเที่ยวทั้ง 4 วัน">
    <defs><clipPath id="tmclip"><rect width="${MAP.w}" height="${MAP.h}" rx="18"/></clipPath>
      <pattern id="tmdot" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".5"/></pattern></defs>
    <g clip-path="url(#tmclip)">
    <rect width="${MAP.w}" height="${MAP.h}" fill="#bfe6f7"/><rect width="${MAP.w}" height="${MAP.h}" fill="url(#tmdot)"/>
    <path d="${land}" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" opacity=".7"/>
    <path d="${land}" fill="#fff4d6" stroke="#f3dca0" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="${land}" fill="#d8efc0" opacity=".75"/>
    ${[[22.40,114.03],[22.42,114.12],[22.37,114.24],[22.24,113.98],[22.26,114.21],[22.23,113.88],[22.40,114.20]].map(a=>tree(...a)).join('')}
    ${[[22.205,114.06],[22.33,113.99],[22.19,114.24],[22.36,113.88],[22.29,114.27]].map(a=>wave(...a)).join('')}
    ${label([22.425,114.06],'นิวเทอริทอรีส์')}${label([22.262,114.238],'เกาะฮ่องกง')}${label([22.215,113.93],'เกาะลันเตา')}
    ${lines}${routes}
    <g transform="translate(${hotel[0].toFixed(1)},${(hotel[1]-4).toFixed(1)})">
      <ellipse cy="13" rx="9" ry="2.6" fill="#000" opacity=".1"/>
      <path d="M-9 -1 L0 -10 L9 -1 Z" fill="var(--pink)" stroke="#d1477a" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="-7" y="-1" width="14" height="12" rx="1.5" fill="var(--sun)" stroke="#e7a52a" stroke-width="1.5"/>
      <rect x="-2" y="4" width="4" height="7" rx="1" fill="#fff"/><path d="M-1 -5 A1.2 1.2 0 0 1 1 -5 Q0 -3 0 -3 Q0 -3 -1 -5Z" fill="#fff"/>
      <text y="22" text-anchor="middle" font-size="7.5" font-weight="700" fill="var(--ink)" stroke="var(--surface)" stroke-width="2.6" paint-order="stroke">ที่พัก</text></g>
    ${icons}</g>
  </svg>`;
}

/* ---------- home: next stop ---------- */
function nextStopHTML(){
  const td=tripDay(), n=hkNow();
  if(!td){
    if(n.date>DAYS[3].date) return '';
    const first=dayItems(1)[0]; return first ? `<div class="nextc pre"><div class="nk">จุดแรกของทริป</div><b>${esc(first.h)}</b><small>ส. 14 พ.ย. · ${esc(first.t)} น.</small></div>` : '';
  }
  const list=dayItems(td), id=nextItem(td), it=list.find(i=>i.id===id);
  if(!it) return `<div class="nextc"><div class="nk">วันนี้เที่ยวครบแล้ว</div><b>กลับไปพักผ่อนกัน</b><div class="acts"><button type="button" class="hbtn main" data-gohome="1">${ic('home',2.2)}พากลับที่พัก</button></div></div>`;
  const {delay,idx}=dayDelay(list), k=list.indexOf(it), shiftOn=delay!=null&&Math.abs(delay)>=10&&k>idx;
  const {prev,opts}=optionsFor(td,it), sel=opts.length?chosen(td,it,opts):null, x=exitFor(it);
  const how = sel ? (sel.legs ? sel.legs.filter(l=>l.line!=='WALK').map(l=>`<span class="ln" style="background:${LINES[l.line].c}">${LINES[l.line].n.split(' ')[0]}</span>`).join(' → ')+` ลง ${esc(stName(sel.legs[sel.legs.length-1].to))}${x?' · Exit '+esc(x.ref):''}`
    : sel.bx ? `${esc(sel.n)} ลงป้าย ${esc(stopName(sel.bx.to))}` : esc(sel.n)) : '';
  return `<div class="nextc"><div class="nk">ถัดไป · ${shiftOn?'≈ '+hhmm(toMin(it.t)+delay):esc(it.t)} น.</div>
    <b>${esc(it.h)}</b>${prev?`<small>จาก ${esc(prev.h)}${sel&&sel.fare!=null?' · '+(sel.fare?hk(sel.fare):'ฟรี'):''}${sel&&sel.mins?' · ~'+sel.mins+' นาที':''}</small>`:''}
    ${how?`<div class="nhow">${how}</div>`:''}
    <div class="acts"><button type="button" class="hbtn main" data-nextnav="${it.id}">${ic('pin',2.2)}นำทาง</button>
      <button type="button" class="hbtn" data-arrive="${it.id}">${ic('check',2.4)}ถึงแล้ว</button>
      <button type="button" class="hbtn" data-gotoday="${td}">ดูแผน</button></div></div>`;
}
/* ---------- home: alerts (only when something needs attention) ---------- */
function alertsHTML(){
  const n=hkNow(), td=tripDay(), me=S.me, out=[];
  const daysTo=Math.ceil((Date.parse(DAYS[0].date)-Date.parse(n.date))/864e5);
  if(me!=null){ const o=octoState(); if(o.bal!=null && o.bal<50) out.push(['warn',`บัตร Octopus เหลือ ${hk(o.bal)} เติมเงินก่อนขึ้นรถ`,'oct']) }
  if(td && me!=null && Number(S.budget)>0){
    const spent=allExp().filter(e=>e.day===td).reduce((s,e)=>s+share(e,me),0), per=Number(S.budget)/4;
    if(spent>per) out.push(['warn',`วันนี้ใช้ไป ${hk(spent)} เกินงบเฉลี่ยต่อวัน (${hk(per)})`,'money']);
  }
  if(td){ const {delay}=dayDelay(dayItems(td)); if(delay!=null && delay>=30) out.push(['info',`ช้ากว่าแผน ${delay} นาที ลองตัดหรือเลื่อนบางจุดในแผนวันนี้`,'plan']) }
  if(td && (n.min>=23*60 || n.min<60) && planSpot().src!=='hotel') out.push(['warn','ดึกแล้ว รถไฟ MTR เที่ยวสุดท้ายส่วนใหญ่ราวเที่ยงคืนถึงตีหนึ่ง กด "พากลับที่พัก" เพื่อดูทาง','home']);
  if(!td && daysTo>0 && daysTo<=7){
    const c=checkStats(); if(me!=null && c.mine<c.total) out.push(['info',`อีก ${daysTo} วันบิน เช็คลิสต์ของคุณยังเหลือ ${c.total-c.mine} อย่าง`,'check']);
    out.push(['info','เช็คเวลาเปิด Disneyland วันที่ 16 และกระเช้า Ngong Ping 360 วันที่ 17 (มีปิดซ่อมเป็นช่วงๆ)','dz']);
  }
  if(!out.length) return '';
  return `<div class="alerts">${out.map(([lv,txt,go])=>`<button type="button" class="al ${lv}" data-algo="${go}">${ic(lv==='warn'?'info':'check')}<span>${esc(txt)}</span></button>`).join('')}</div>`;
}
/* ---------- home: today's summary ---------- */

}

async function saveCheck(items){
  S.check=items; renderHome();
  if(db){ try{ await serial('check',()=>db.doc('trip/checklist').set({items})) }catch(e){ toast('บันทึกเช็คลิสต์ไม่สำเร็จ') } }
  else lsSet('hk-check', JSON.stringify(items));
}
function toggleCheck(id){ const me=S.me??0; saveCheck(checkItems().map(x=>x.id===id?{...x, d:x.d.map((v,i)=>i===me?!v:v)}:x)) }

function navRoutes(a,b){
  if(!a||!b||!a.ll||!b.ll) return [];
  const d=metres(a.ll,b.ll), out=[], n=hkNow(), td=tripDay();
  if(d<1500) out.push({k:'walk', mode:'walk', n:'เดิน', d:`ประมาณ ${d<1000?Math.round(d/10)*10+' ม.':(d/1000).toFixed(1)+' กม.'}`, fare:0, mins:Math.max(3,Math.round(d*1.25/75))});
  if(NET && a.st && b.st && a.st!==b.st && d>=600){ // not worth the train for a short walk
    const ia=NET.byCode[a.st], ib=NET.byCode[b.st], legs=mtrRoute(ia,ib), f=mtrFare(ia,ib);
    if(legs){
      const w1 = a.isSt ? 0 : metres(a.ll, stLL(a.st)), w2 = b.isSt ? 0 : metres(b.ll, stLL(b.st));
      const inEx = a.isSt ? null : a.exit ? {ref:a.exit, name:a.exitName||'ตามแผนผัง MTR'} : nearestExit(a.st, a.ll), outEx = b.isSt ? null : b.exit ? {ref:b.exit, name:b.exitName||'ตามแผนผัง MTR'} : (namedExit(b.st,{h:b.n,map:b.n}) || nearestExit(b.st, b.ll));
      out.push({k:'mtr', mode:'mtr', n:'MTR', d:legs.filter(l=>l.line!=='WALK').map(l=>LINES[l.line].n.split(' ')[0]).join(' → ')+` · ${stName(ia)} → ${stName(ib)}`,
        fare:f, mins:Math.round(legMins(legs)+(w1+w2)*1.2/75), legs, inEx, outEx, w1:Math.round(w1), w2:Math.round(w2), from:a.st, to:b.st});
    }
  }
  for(const o of busRoutes(a.ll, b.ll, {dow:dowOf(td?DAYS[td-1].date:n.date), min:n.min})) out.push({...busOpt(o), k:o.key});
  if(d>=700){ const road=d*1.35, fare=Math.round(29+Math.max(0,road-2000)/200*2.1); // HK urban taxi: HK$29 first 2 km, ~HK$2.1 per 200 m after
    out.push({k:'taxi', mode:'taxi', n:'แท็กซี่ (ประมาณ)', d:'ราคาประมาณสำหรับแท็กซี่สีแดง ยังไม่รวมค่าทางด่วน', fare, mins:Math.round(road/1000*3+5), shared:true}); }
  const paid=out.filter(o=>o.fare!=null && o.mode!=='walk' && o.mode!=='taxi');
  const cheap=paid.length?paid.reduce((m,o)=>o.fare<m.fare?o:m):null, fast=out.filter(o=>o.mins).reduce((m,o)=>!m||o.mins<m.mins?o:m,null);
  out.forEach(o=>{ o.cheap=o===cheap&&paid.length>1; o.fast=o===fast&&out.length>1 });

  const rank=o=>o.mode==='walk'&&o.mins<=15?0:o.mode==='taxi'?2:1;
  return out.sort((x,y)=>rank(x)-rank(y) || (x.mins||99)-(y.mins||99));
}

// each phone records its own owner's transport fare for stops marked arrived (by either person), and removes it when un-marked
const pend=new Set();
async function reconcile(){
  if(S.me==null || !S.ready.prog || !S.ready.mine) return;
  let changed=false;
  for(const [id,v] of Object.entries(S.done)){
    if(!v || typeof v!=='object' || !(v.fare>0) || v.shared) continue;
    const key='auto-'+id; if(S.mine.some(e=>e.id===key) || S.meta.skip[key] || pend.has(key)) continue;
    const f=findItem(id); pend.add(key);
    try{ await putMine(key,{amt:v.fare, cat:'transport', day:f?f.dn:0, note:String(v.label||'ค่าเดินทาง').slice(0,60), payer:S.me, type:'own', auto:true, oct:v.oct!==false, at:Date.now()}); changed=true }catch(e){}
    pend.delete(key);
  }
  for(const e of S.mine.slice()){
    if(!e.auto || !String(e.id).startsWith('auto-')) continue;
    if(!S.done[e.id.slice(5)] && !pend.has(e.id)){ pend.add(e.id); try{ await removeMine(e.id); changed=true }catch(_){} pend.delete(e.id) }
  }
  if(changed && !privCol()) rerender();
}
async function putExpense(id,row){
  if(db) await db.collection('expenses').doc(id).set(row);
  else { const k=S.expenses.findIndex(e=>e.id===id); const r={...row,id}; if(k>=0) S.expenses[k]=r; else S.expenses.unshift(r); lsSave() }
}
async function removeExpense(id){
  if(db) await db.collection('expenses').doc(id).delete();

function fixHotel(items){ const defs=Object.fromEntries(DEFAULT_PLAN.flat().map(d=>[d.id,d]));

async function saveItem(){
  readItemForm(); const d=S.sheet, err=document.getElementById('i-err');
  if(!d.h.trim()||!d.t){ err.hidden=false; err.textContent='ใส่ชื่อสถานที่และเวลาเริ่มก่อน'; return }
  const old = d.id ? findItem(d.id) : null;
  const it = old ? {...old.it} : {id:uid()};
  Object.assign(it,{t:d.t, h:d.h.trim().slice(0,60), st:d.st||null});
  if(d.e) it.e=d.e; else delete it.e;
  if(d.preview){ // picked from place search: keep coordinates, cheapest way there, entry fee and Claude's tip
    it.ll=d.ll;
    if(d.preview.best) it.go={mode:d.preview.best.key};
    const fd=d.cat==='food'||d.cat==='cafe';
    if(d.fee>0) it.cost={amt:d.fee, note:(fd?'ค่าอาหาร ':'ค่าเข้า ')+it.h.slice(0,30), cat:fd?'food':'ticket'}; else delete it.cost;
    if(d.tip) it.tip=d.tip;
  }
  const ex=d.ex.trim().toUpperCase().slice(0,6);
  const auto = it.st ? nearestExit(it.st, it.ll || DEF_LL[it.id]) : null;
  if(ex && it.st && (!auto || ex!==auto.ref)){ it.exit=ex; it.exitUser=true }   // typed by hand: keep it
  else { delete it.exitUser; if(!ex) delete it.exit }
  if(d.map.trim()) it.map=d.map.trim(); else delete it.map;
  const plain = old&&old.it.p ? old.it.p.replace(/<[^>]+>/g,'') : '';
  if(d.p.trim()!==plain) it.p=esc(d.p.trim()); // user notes are stored escaped
  if(!d.p.trim()) delete it.p;
  // edited by hand: later data updates leave this item's notes and place alone
  if(old && (d.p.trim()!==plain || d.map.trim()!==(old.it.map||'') || (d.st||null)!==(old.it.st||null) || d.preview)) it.custom=true;
  if(old && old.dn!==d.day) S.plan[old.dn-1]=S.plan[old.dn-1].filter(x=>x.id!==it.id);
  const arr=S.plan[d.day-1], k=arr.findIndex(x=>x.id===it.id);
  if(k>=0) arr[k]=it; else arr.push(it);
  // push later stops of that day back if this one now runs into them
  let shifted=0, delta=0;
  const later=dayItems(d.day).filter(x=>x.id!==it.id && toMin(x.t)>=toMin(it.t) && !S.done[x.id]);
  const end=toMin(it.e||it.t)+(it.e?0:30);
  if(later.length && end>toMin(later[0].t)){
    delta=end-toMin(later[0].t);
    for(const x of later){ x.t=hhmm(toMin(x.t)+delta); if(x.e) x.e=hhmm(toMin(x.e)+delta); shifted++ }
  }
  closeSheet(); S.day=Number(d.day); renderAll();
  try{ await savePlanDay(d.day); if(old && old.dn!==d.day) await savePlanDay(old.dn);
    toast((old?(old.dn!==d.day?'ย้ายวันแล้ว':'แก้ไขแล้ว'):'เพิ่มลงแผนแล้ว')+(shifted?` · เลื่อน ${shifted} รายการถัดไป +${delta} นาที`:'')) }catch(e){}
}

/* ---------- own website: shared data in Supabase (used only outside Claude) ----------
   Same small API the app already uses (doc/collection, set, delete, onSnapshot).
   Each person opens the app once from their own link (#k=...), the key then stays on the phone.
   Everything is cached on the phone, so the app opens and records offline; changes are sent when back online. */
const SB = {url:'https://btagqhxhljlbhwwkzghr.supabase.co', key:'sb_publishable_S8yqxmseObhtyqdxmW2A7w_DCyZwPfd'};
function hkKey(){
  const m=location.hash.match(/[#&]k=([\w-]{16,})/);
  if(m){ lsSet('hk-key', m[1]); history.replaceState(null,'',location.pathname+location.search) }
  return lsGet('hk-key','');
}
async function sbRpc(fn, args){
  const r = await fetch(SB.url+'/rest/v1/rpc/'+fn, {method:'POST', headers:{apikey:SB.key,'Content-Type':'application/json'}, body:JSON.stringify(args)});
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw Object.assign(new Error((j&&j.message)||('HTTP '+r.status)), {code:j&&j.code, http:r.status});
  return j;
}
// field-level differences, so two phones changing different parts of one document both win
function sbDiff(a, b, path=[], out=[]){
  const obj = v => v && typeof v==='object';
  if(obj(a) && obj(b) && Array.isArray(a)===Array.isArray(b) && (!Array.isArray(a) || a.length===b.length)){
    for(const k of new Set([...Object.keys(a),...Object.keys(b)])){
      if(!(k in b)) out.push([[...path,k],null,true]);
      else if(!(k in a)) out.push([[...path,k],b[k]]);
      else sbDiff(a[k], b[k], [...path,k], out);
    }
  } else if(JSON.stringify(a)!==JSON.stringify(b)) out.push([path,b]);
  return out;
}
function hkStore(key){
  const C = (()=>{ try{ return JSON.parse(lsGet('hk-cache','null'))||{} }catch(e){ return {} } })();
  const docs = new Map(Object.entries(C.docs||{}));      // path -> data (what this phone shows)
  const base = new Map(Object.entries(C.base||{}));      // path -> data as last seen on the server
  let since = C.since||null, queue = C.queue||[], subs = new Set(), busy=false, timer=null;
  const persist = () => lsSet('hk-cache', JSON.stringify({docs:Object.fromEntries(docs), base:Object.fromEntries(base), since, queue}));
  const notify = () => subs.forEach(f=>{ try{ f() }catch(e){ console.error(e) } });
  const status = s => { S.net=s; renderHeader() };
  async function flush(){
    while(queue.length){
      const q=queue[0];
      try{
        if(q.del) await sbRpc('hk_del',{p_key:key,p_path:q.path});
        else if(base.has(q.path)){ const ops=sbDiff(base.get(q.path), q.data); if(ops.length) await sbRpc('hk_patch',{p_key:key,p_path:q.path,p_ops:ops}) }
        else await sbRpc('hk_put',{p_key:key,p_path:q.path,p_data:q.data});
        if(q.del) base.delete(q.path); else base.set(q.path, clone(q.data));
        queue = queue.filter(x=>x!==q); persist();
      }catch(e){ if(e.http>=400 && e.http<500 && e.code!=='28000'){ queue = queue.filter(x=>x!==q); persist(); toast('บันทึกไม่สำเร็จ: '+e.message); continue } throw e }
    }
  }
  async function sync(){
    if(busy) return; busy=true;
    try{
      await flush();
      // look back 15 s each time: a write saved a moment earlier on the other phone is never skipped
      const rows = await sbRpc('hk_pull',{p_key:key,p_since:since?new Date(Date.parse(since)-15000).toISOString():null});
      let changed=false;
      for(const r of rows){
        since = r.updated_at;
        if(r.deleted){ base.delete(r.path); if(!queue.some(q=>q.path===r.path)){ if(docs.delete(r.path)) changed=true } }
        else { base.set(r.path, r.data); if(!queue.some(q=>q.path===r.path)){ docs.set(r.path, r.data); changed=true } }
      }
      persist(); status(queue.length?'wait':'on'); if(changed) notify();
    }catch(e){ status('off'); if(e.code==='28000') S.badKey=true }
    finally{ busy=false }
  }
  function write(path, data){
    if(data==null) docs.delete(path); else docs.set(path, clone(data));
    queue = queue.filter((q,i)=>q.path!==path || (i===0 && busy)); // one pending write per document (the one being sent stays)
    queue.push(data==null ? {path, del:true} : {path, data:clone(data)});
    persist(); notify(); status('wait'); setTimeout(sync, 50);
    return Promise.resolve();
  }
  const snapDoc = path => { const d=docs.get(path); return {id:path.split('/').pop(), exists:d!=null, data:()=>d==null?undefined:clone(d)} };
  const snapCol = (col, order) => {
    const pre=col+'/', list=[...docs.keys()].filter(p=>p.startsWith(pre) && !p.slice(pre.length).includes('/')).map(snapDoc);
    if(order) list.sort((a,b)=>{ const x=a.data()[order.f], y=b.data()[order.f]; return (x>y?1:x<y?-1:0)*(order.dir==='desc'?-1:1) });
    return {docs:list};
  };
  const listen = (fn, make) => { let last=''; const f=()=>{ const s=make(), k=JSON.stringify(s.docs?s.docs.map(d=>[d.id,d.data()]):s.data()); if(k!==last){ last=k; fn(s) } }; subs.add(f); setTimeout(f,0); return ()=>subs.delete(f) };
  const docRef = path => ({ get:async()=>snapDoc(path), set:d=>write(path,d), delete:()=>write(path,null), onSnapshot:fn=>listen(fn,()=>snapDoc(path)) });
  const colRef = (col, order) => ({ doc:id=>docRef(col+'/'+id), orderBy:(f,dir)=>colRef(col,{f,dir}), onSnapshot:fn=>listen(fn,()=>snapCol(col,order)) });
  const loop = () => { clearTimeout(timer); timer=setTimeout(async()=>{ if(document.visibilityState==='visible') await sync(); loop() }, queue.length?3000:6000) };
  addEventListener('online', sync); document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') sync() });
  sync(); loop();
  return {doc:docRef, collection:c=>colRef(c), sync};
}
async function hkStoreStart(){
  const key=hkKey(); if(!key) return null;
  let me=null; try{ me=JSON.parse(lsGet('hk-me-info','null')) }catch(e){}
  try{ me = await sbRpc('hk_me',{p_key:key}); lsSet('hk-me-info', JSON.stringify(me)) }
  catch(e){ if(e.code==='28000'){ lsSet('hk-key',''); lsSet('hk-me-info',''); return null } } // wrong link; offline keeps the saved one
  if(!me) return null;
  return {db:hkStore(key), user:{id:async()=>me.uid}};
}

  let ns=null, us=null;

      S.mine=docs.filter(d=>d.id!=='profile'); S.ready.mine=true; rerender(); reconcile();
    }, fail);
  }
  [1,2,3,4].forEach(n=>db.doc('plan/d'+n).onSnapshot(d=>{ S.plan[n-1] = d.exists && Array.isArray(d.data().items) ? fixHotel(clone(d.data().items)) : clone(DEFAULT_PLAN[n-1]); rerender() }, fail));
})();
