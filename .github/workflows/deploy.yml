# Publish the website only after it passes a real-browser test (tools/smoke.js):
# every tab must open with no script error and all trip simulations must pass.
# If the test fails, the previous version stays online and GitHub emails the owner.
name: test-and-publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Open every tab and run the trip simulations
        run: node tools/smoke.js .
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
