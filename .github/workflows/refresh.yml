# Every morning (06:00 Hong Kong time) download the latest official MTR, bus, weather and
# water-dispenser data, check it, rebuild the site and publish it. If anything fails the
# old data stays online, nothing is overwritten.
name: refresh-data
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Free Supabase projects go to sleep after 7 quiet days; one small read a day keeps the sync awake.
      - name: Keep the sync database awake
        continue-on-error: true
        run: |
          curl -s -X POST "https://btagqhxhljlbhwwkzghr.supabase.co/rest/v1/rpc/hk_pull" \
            -H "apikey: sb_publishable_S8yqxmseObhtyqdxmW2A7w_DCyZwPfd" -H "Content-Type: application/json" \
            -d '{"p_key":"keepalive","p_since":"2100-01-01T00:00:00Z"}' -o /dev/null -w "supabase %{http_code}\n" || true
          curl -s "https://btagqhxhljlbhwwkzghr.supabase.co/functions/v1/hk-queue" -o /dev/null -w "queue %{http_code}\n" || true
      - name: Download and check new data
        run: bash tools/refresh.sh
      - name: Publish if something changed
        run: |
          git config user.name "hk-trip-bot"
          git config user.email "hk-trip-bot@users.noreply.github.com"
          git add -A index.html sw.js hk-trip.html bus.json places.json water.json weather.json lasttrain.json dzcal.json data-cache/last-osm
          git diff --cached --quiet || git commit -m "Daily data refresh $(date -u +%F)"
          git push
